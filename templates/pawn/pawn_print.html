<!DOCTYPE html>
{% load form_tags %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Pawn Ticket</title>
    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <style>
        /* Exact Physical Dimensions for Page Printing */
        @page {
            size: 250mm 180mm portrait;
            margin: 0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12pt;
            font-weight: bold;
            color: #000;
            background-color: transparent;
            -webkit-print-color-adjust: exact;
        }

        /* Fixed Canvas Container: 250mm x 180mm */
        .ticket-container {
            width: 250mm;
            height: 180mm;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Data Blank Element Base Styling */
        .blank-data {
            position: absolute;
            white-space: nowrap;
            overflow: hidden;
            line-height: 1;
        }

        /* -------------------------------------------------------------
           DEBUG GUIDELINES:
           Add class "show-guidelines" to .ticket-container to preview 
           borders/underlines while calibrating printer positioning.
           ------------------------------------------------------------- */
        .ticket-container.show-guidelines {
            border: 1px red solid;
        }

        .ticket-container.show-guidelines .blank-data {
            border-bottom: 1px dashed blue;
            background-color: rgba(0, 0, 255, 0.05);
        }

        /* ABSOLUTE POSITIONING & SIZING FOR ALL FORM BLANKS (250mm x 180mm) */

        /* Top Header Dates */
        #dateLoanGranted {
            top: 42mm;
            left: 45mm;
            width: 65mm;
            height: 6mm;
        }

        #maturityDate {
            top: 36mm;
            left: 175mm;
            width: 68mm;
            height: 6mm;
        }

        #expiryDate {
            top: 41mm;
            left: 215mm;
            width: 38mm;
            height: 6mm;
        }

        /* Pawner Info Row */
        #borrowerName {
            top: 58mm;
            left: 25mm;
            width: 65mm;
            height: 6mm;
        }

        #borrowerAddress {
            top: 58mm;
            left: 150mm;
            width: 80mm;
            height: 6mm;
        }

        /* Loan Value & Terms */
        #loanPesosWords {
            top: 70mm;
            left: 45mm;
            width: 90mm;
            height: 6mm;
        }

        #loanPesosNum {
            top: 70mm;
            left: 180mm;
            width: 30mm;
            height: 6mm;
        }

        #interestWords {
            top: 78mm;
            left: 10mm;
            width: 14mm;
            height: 6mm;
            text-align: center;
        }

        #interestRate {
            top: 78mm;
            left: 55mm;
            width: 8mm;
            height: 6mm;
            text-align: center;
        }

        #loanTermDays {
            top: 78mm;
            left: 82mm;
            width: 8mm;
            height: 6mm;
            text-align: center;
        }

        #penaltyInterest {
            top: 84mm;
            left: 180mm;
            width: 75mm;
            height: 6mm;
        }

        /* Pawn Description Area */
        #pawnDescLine1 {
            top: 108mm;
            left: 5mm;
            width: 130mm;
            height: 6mm;
        }

        #pawnDescLine2 {
            top: 115mm;
            left: 5mm;
            width: 130mm;
            height: 6mm;
        }

        #pawnDescLine3 {
            top: 122mm;
            left: 5mm;
            width: 130mm;
            height: 6mm;
        }

        /* Pawner ID & Contact */
        #idPresented {
            top: 141mm;
            left: 30mm;
            width: 30mm;
            height: 6mm;
        }

        #idNumber {
            top: 147mm;
            left: 30mm;
            width: 30mm;
            height: 6mm;
        }

        #contactNo {
            top: 147mm;
            left: 97mm;
            width: 32mm;
            height: 6mm;
        }

        /* Financial Summary Breakdown (Right Column) */
        #principalAmount {
            top: 100mm;
            left: 195mm;
            width: 45mm;
            height: 6mm;
            text-align: right;
        }

        #interestAmount {
            top: 107mm;
            left: 195mm;
            width: 45mm;
            height: 6mm;
            text-align: right;
        }

        #serviceCharge {
            top: 114mm;
            left: 195mm;
            width: 45mm;
            height: 6mm;
            text-align: right;
        }

        #netProceeds {
            top: 122mm;
            left: 195mm;
            width: 45mm;
            height: 6mm;
            text-align: right;
        }

        #effectiveInterestRate {
            top: 132mm;
            left: 225mm;
            width: 20mm;
            height: 6mm;
        }

        /* Checkbox Indicators */
        #checkPerAnnum {
            top: 146mm;
            left: 183mm;
            width: 4mm;
            font-size: 10pt;
            text-align: center;
        }

        #checkPerMonth {
            top: 146mm;
            left: 213mm;
            width: 4mm;
            font-size: 10pt;
            text-align: center;
        }

        #checkOthers {
            top: 146mm;
            left: 237mm;
            width: 4mm;
            font-size: 10pt;
            text-align: center;
        }

        #cashierName {
            top: 158mm;
            left: 180mm;
            width: 75mm;
            font-size: 10pt;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- Add 'show-guidelines' class to the div below while aligning printer feed -->
    <div class="ticket-container">

        <!-- TOP HEADER DATES -->
        <div id="dateLoanGranted" class="blank-data"></div>
        <div id="maturityDate" class="blank-data"></div>
        <div id="expiryDate" class="blank-data"></div>

        <!-- PAWNER INFORMATION -->
        <div id="borrowerName" class="blank-data"></div>
        <div id="borrowerAddress" class="blank-data"></div>

        <!-- LOAN VALUE & INTEREST DETAILS -->
        <div id="loanPesosWords" class="blank-data"></div>
        <div id="loanPesosNum" class="blank-data"></div>
        <div id="interestRate" class="blank-data"></div>
        <div id="interestWords" class="blank-data"></div>
        <div id="loanTermDays" class="blank-data"></div>
        <div id="penaltyInterest" class="blank-data"></div>

        <!-- ARTICLE DESCRIPTION -->
        <div id="pawnDescLine1" class="blank-data"></div>
        <div id="pawnDescLine2" class="blank-data"></div>
        <div id="pawnDescLine3" class="blank-data"></div>

        <!-- IDENTIFICATION & CONTACT -->
        <div id="idPresented" class="blank-data"></div>
        <div id="idNumber" class="blank-data"></div>
        <div id="contactNo" class="blank-data"></div>

        <!-- FINANCIAL SUMMARY (RIGHT COLUMN) -->
        <div id="principalAmount" class="blank-data text-right"></div>
        <div id="interestAmount" class="blank-data text-right"></div>
        <div id="serviceCharge" class="blank-data text-right"></div>
        <div id="netProceeds" class="blank-data text-right"></div>
        <div id="effectiveInterestRate" class="blank-data"></div>

        <!-- RATE PERIOD CHECKMARKS ("X" or "✓") -->
        <div id="checkPerAnnum" class="blank-data"></div>
        <div id="checkPerMonth" class="blank-data"></div>
        <div id="checkOthers" class="blank-data"></div>

        <!-- CASHIER SIGNATURE -->
        <div id="cashierName" class="blank-data"></div>

    </div>

    <!-- JAVASCRIPT FOR DATABASE POPULATION -->
    <script>
        function renderPawnTicketData(data) {
            if (!data) return;

            Object.keys(data).forEach(key => {
                const targetDiv = document.getElementById(key);
                if (targetDiv) {
                    targetDiv.textContent = data[key];
                }
            });
        }

        renderPawnTicketData({
            dateLoanGranted: '{{ pawn.date_granted|date:"m/d/Y" }}',
            maturityDate: '{{ pawn.maturity_date|date:"m/d/Y" }}',
            expiryDate: '{{ pawn.expiry_date|date:"m/d/Y" }}',
            borrowerName: '{{ pawn.client.full_name|upper }}',
            borrowerAddress: '{{ pawn.client.address|upper }}',
            loanPesosWords: '{{ pawn.principal|to_words|upper }}',
            loanPesosNum: '{{ pawn.principal|currency }}',
            interestRate: '3',
            interestWords: 'THREE',
            loanTermDays: '30',
            penaltyInterest: 'NONE',
            pawnDescLine1: '{{ description1 }}',
            pawnDescLine2: '{{ description2 }}',
            pawnDescLine3: '{{ description3 }}',
            idPresented: '{{ pawn.client.id_link.type|upper }}',
            idNumber: '{{ pawn.client.id_number|upper }}',
            contactNo: '{{ pawn.client.contact_num }}',
            principalAmount: '{{ pawn.principal|currency }}',
            interestAmount: '{{ pawn.get_interest|currency }}',
            serviceCharge: '{{ pawn.service_charge|currency }}',
            netProceeds: '{{ pawn.net_proceeds|currency }}',
            effectiveInterestRate: ' ',
            checkPerMonth: '.',
            checkPerAnnum: '.',
            checkOthers: '.',
            cashierName: '{{ cashier }}'
        });
    </script>

</body>

</html>
